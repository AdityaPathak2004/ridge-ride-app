<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a2d"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#2a2a2d"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.4)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0)"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="150" cy="100" rx="135" ry="5" fill="rgba(0,0,0,0.7)" />

  <!-- Underglow -->
  <rect x="20" y="95" width="260" height="4" fill="#3b82f6" filter="url(#glow)" opacity="0.6"/>

  <!-- Main Body -->
  <path d="M 30 25 C 30 12, 45 8, 60 8 L 240 8 C 275 8, 288 25, 292 50 L 294 90 C 294 95, 288 98, 280 98 L 15 98 C 10 98, 6 95, 6 90 L 6 40 C 6 28, 15 25, 30 25 Z" fill="url(#bodyGrad)"/>
  
  <!-- Edge highlight -->
  <path d="M 60 8 L 240 8 C 275 8, 288 25, 292 50" fill="none" stroke="#55555a" stroke-width="2"/>

  <!-- Lower body trim -->
  <path d="M 6 80 L 293.5 80 L 294 90 C 294 95, 288 98, 280 98 L 15 98 C 10 98, 6 95, 6 90 Z" fill="#18181b"/>

  <!-- Front Windshield -->
  <path d="M 240 15 L 260 15 C 275 15, 285 28, 288 50 L 289 60 L 235 60 Z" fill="url(#glassGrad)"/>
  
  <!-- Windshield reflection -->
  <path d="M 242 17 L 258 17 C 270 17, 280 28, 282 40 L 270 40 Z" fill="rgba(255,255,255,0.04)"/>

  <!-- Side Windows -->
  <rect x="35" y="20" width="55" height="40" rx="5" fill="url(#glassGrad)"/>
  <rect x="100" y="20" width="60" height="40" rx="5" fill="url(#glassGrad)"/>
  <rect x="170" y="20" width="55" height="40" rx="5" fill="url(#glassGrad)"/>
  
  <!-- Window reflections -->
  <path d="M 35 25 L 90 25 L 85 45 L 35 45 Z" fill="rgba(255,255,255,0.03)"/>
  <path d="M 100 25 L 160 25 L 155 45 L 100 45 Z" fill="rgba(255,255,255,0.03)"/>
  <path d="M 170 25 L 225 25 L 220 45 L 170 45 Z" fill="rgba(255,255,255,0.03)"/>

  <!-- Doors -->
  <rect x="235" y="20" width="16" height="74" rx="3" fill="url(#glassGrad)"/>
  <rect x="253" y="20" width="16" height="74" rx="3" fill="url(#glassGrad)"/>

  <!-- Glowing Accent Line -->
  <rect x="6" y="74" width="287.5" height="2" fill="#3b82f6" filter="url(#glow)"/>

  <!-- Wheel Arches -->
  <path d="M 45 98 A 26 26 0 0 1 97 98" fill="#111"/>
  <path d="M 205 98 A 26 26 0 0 1 257 98" fill="#111"/>

  <!-- Wheels -->
  <circle cx="71" cy="98" r="20" fill="#09090b"/>
  <circle cx="71" cy="98" r="10" fill="#27272a"/>
  <circle cx="71" cy="98" r="4" fill="#3b82f6"/>
  
  <circle cx="231" cy="98" r="20" fill="#09090b"/>
  <circle cx="231" cy="98" r="10" fill="#27272a"/>
  <circle cx="231" cy="98" r="4" fill="#3b82f6"/>
  
  <!-- Headlight -->
  <path d="M 288 65 L 295 65 C 295 65, 296 68, 295 72 L 288 72 Z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 285 65 L 287 65 L 287 72 L 285 72 Z" fill="#3b82f6"/>
  
  <!-- Headlight Beam -->
  <polygon points="295,68 320,55 320,80 295,72" fill="url(#beam)"/>

  <!-- Taillight -->
  <rect x="4" y="55" width="4" height="20" rx="1" fill="#ff453a" filter="url(#glow)"/>
</svg>
